name: Deploy to Hostinger Shared Hosting (FTP)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🛠️ Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🔍 TypeScript Type Check
      run: npx tsc --noEmit

    - name: 🧹 Lint Code
      run: npm run lint --if-present

    - name: 📦 Build
      run: npm run build
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    - name: 🚀 Deploy via FTP (lftp)
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
        # Deploy to public_html directory on Hostinger
        lftp -u "u402219950","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" -e "
          set ssl:verify-certificate no;
          set net:timeout 60;
          set net:max-retries 5;
          set ftp:passive-mode true;
          set ftp:ssl-allow false;
          lcd ./dist;
          mirror -R --overwrite --verbose . public_html;
          bye
        "

    - name: ✅ Verify Deployment
      run: |
        echo "Checking deployed files..."
        curl -s -o /dev/null -w "%{http_code}" https://emeraldconsultancycompany.com/ || echo "Site check failed"
        echo "Deployment verification complete"
